<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>K Sebe Yoga App</title>
    <script type="text/javascript">
      // Single Page App GitHub Pages redirect
      // This script takes the current URL path and redirects
      // to the index.html with the path stored in sessionStorage
      var pathSegmentsToKeep = 0; // Set to 0 for custom domain (app.ksebe-studio.ru)

      const { protocol, hostname, port, pathname, search, hash } = window.location;
      const basePath = pathname
        .split('/')
        .slice(0, 1 + pathSegmentsToKeep)
        .join('/');
      const spaPath = pathname
        .slice(1)
        .split('/')
        .slice(pathSegmentsToKeep)
        .join('/')
        .replace(/&/g, '~and~');
      const spaSearch = search ? `&${search.slice(1).replace(/&/g, '~and~')}` : '';
      const newUrl = `${protocol}//${hostname}${port ? `:${port}` : ''}${basePath}/?/${spaPath}${spaSearch}${hash}`;
      window.location.replace(newUrl);
    </script>
  </head>
  <body></body>
</html>
