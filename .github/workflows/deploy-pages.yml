name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build for Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Debug env
        run: |
          echo "SUPABASE_URL set: ${{ secrets.VITE_SUPABASE_URL != '' }}"
          echo "SUPABASE_KEY set: ${{ secrets.VITE_SUPABASE_ANON_KEY != '' }}"

      - name: Debug CNAME
        run: |
          echo "CNAME file exists in public: $(test -f k-sebe-yoga-studioWEB/public/CNAME && echo 'YES' || echo 'NO')"
          cat k-sebe-yoga-studioWEB/public/CNAME 2>/dev/null || echo "No CNAME file"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build WEB for production
        run: npm run build:web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Custom domain ksebe-studio.ru served from root (CNAME configured)
          VITE_BASE_PATH: /

      - name: Debug build output
        run: |
          echo "=== Dist directory contents ==="
          ls -la k-sebe-yoga-studioWEB/dist/ || echo "Directory not found"
          echo "=== CNAME file check ==="
          cat k-sebe-yoga-studioWEB/dist/CNAME 2>/dev/null || echo "No CNAME in dist"

      - name: Copy CNAME to dist
        run: |
          if [ -f k-sebe-yoga-studioWEB/public/CNAME ] && [ ! -f k-sebe-yoga-studioWEB/dist/CNAME ]; then
            echo "Copying CNAME from public to dist"
            cp k-sebe-yoga-studioWEB/public/CNAME k-sebe-yoga-studioWEB/dist/CNAME
          elif [ -f k-sebe-yoga-studioWEB/dist/CNAME ]; then
            echo "CNAME already exists in dist"
          else
            echo "Warning: No CNAME file found"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: k-sebe-yoga-studioWEB/dist

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
