name: Capacitor Native Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios
          - both
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

# Only one native build at a time to avoid Gradle/Xcode conflicts
concurrency:
  group: capacitor-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Web bundle build (shared step) ───────────────────────────────────────
  build-web:
    name: Build Web Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build APP
        run: npm run build:app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: k-sebe-yoga-studio-APPp/dist/
          retention-days: 1

  # ── Android build ─────────────────────────────────────────────────────────
  build-android:
    name: Build Android (${{ inputs.build_type }})
    runs-on: ubuntu-latest
    needs: build-web
    if: inputs.platform == 'android' || inputs.platform == 'both'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: k-sebe-yoga-studio-APPp/dist/

      - name: Add Android platform (if missing)
        working-directory: k-sebe-yoga-studio-APPp
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        working-directory: k-sebe-yoga-studio-APPp
        run: npx cap sync android

      - name: Build Android Debug APK
        if: inputs.build_type == 'debug'
        working-directory: k-sebe-yoga-studio-APPp/android
        run: ./gradlew assembleDebug

      - name: Build Android Release APK
        if: inputs.build_type == 'release'
        working-directory: k-sebe-yoga-studio-APPp/android
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ inputs.build_type }}-apk
          path: |
            k-sebe-yoga-studio-APPp/android/app/build/outputs/apk/debug/*.apk
            k-sebe-yoga-studio-APPp/android/app/build/outputs/apk/release/*.apk
          retention-days: 7

  # ── iOS build ─────────────────────────────────────────────────────────────
  build-ios:
    name: Build iOS (${{ inputs.build_type }})
    runs-on: macos-latest
    needs: build-web
    if: inputs.platform == 'ios' || inputs.platform == 'both'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: k-sebe-yoga-studio-APPp/dist/

      - name: Add iOS platform (if missing)
        working-directory: k-sebe-yoga-studio-APPp
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Sync Capacitor
        working-directory: k-sebe-yoga-studio-APPp
        run: npx cap sync ios

      - name: Install CocoaPods
        working-directory: k-sebe-yoga-studio-APPp/ios/App
        run: pod install

      - name: Build iOS (simulator)
        if: inputs.build_type == 'debug'
        working-directory: k-sebe-yoga-studio-APPp/ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty

      - name: Upload iOS build
        if: inputs.build_type == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: ios-debug-app
          path: k-sebe-yoga-studio-APPp/ios/App/build/Build/Products/Debug-iphonesimulator/*.app
          retention-days: 7
